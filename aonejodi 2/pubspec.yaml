name: app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+27

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_facebook_auth: ^6.0.4
  facebook_app_events: ^0.19.0
  cupertino_icons: ^1.0.6
  animated_splash_screen: ^1.3.0
  get: ^4.6.6
  intl: ^0.19.0
  intl_phone_number_input: ^0.7.4
  http: ^1.2.2
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  razorpay_flutter: ^1.4.0
  shared_preferences: ^2.2.3
  image: ^4.2.0
  sizer: ^2.0.15
  fluttertoast: ^8.2.4
  permission_handler: ^11.3.1
  flutter_launcher_icons: ^0.13.1
  intl_phone_field: ^3.2.0
  carousel_slider: ^5.0.0
  html: ^0.15.4
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  flutter_custom_tabs: ^2.4.0
  crypto: ^3.0.3
  convert: ^3.1.1
  html_unescape: ^2.0.0
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "images/splash-screen-logo/appsplash.jpg"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "images/splash-screen-logo/appsplash.jpg"

flutter:
  uses-material-design: true
  assets:
    - images/splash-screen-logo/
    - images/
    - images/about-us-page-images/