name: Build Flutter iOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Install Dependencies & Build iOS
        working-directory: './aonejodi 2'
        run: |
          echo "==> Current Directory: $(pwd)"
          flutter pub get
          
          if [ -d "ios" ]; then
            cd ios
            pod install || true
            cd ..
          fi
          
          flutter build ios --release --no-codesign

      - name: Create IPA Package
        working-directory: './aonejodi 2'
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/ 2>/dev/null || mv Runner.app Payload/
          zip -r ios-app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-runner
          path: "aonejodi 2/build/ios/iphoneos/ios-app.ipa"
