name: Build Flutter iOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Locate, Install & Build
        run: |
          # Automatically find directory with pubspec.yaml
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml file missing!"
            exit 1
          fi
          
          TARGET_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Found project at: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          echo "==> Running Flutter Pub Get"
          flutter pub get
          
          if [ -d "ios" ]; then
            echo "==> Installing Pods"
            cd ios
            pod install || true
            cd ..
          fi
          
          echo "==> Building iOS Application"
          flutter build ios --release --no-codesign
          
          echo "==> Creating IPA Bundle"
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/ 2>/dev/null || mv Runner.app Payload/
          zip -r ios-app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-runner
          path: "**/ios-app.ipa"
