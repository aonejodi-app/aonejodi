name: Build Flutter iOS Unsigned

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true

      - name: Locate Flutter Project
        id: project
        shell: bash
        run: |
          PUBSPEC_PATH=$(find . \
            -name pubspec.yaml \
            -not -path "*/.dart_tool/*" \
            -not -path "*/build/*" \
            -not -path "*/.git/*" | head -n 1)

          if [ -z "$PUBSPEC_PATH" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Get Flutter Dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter pub get

      
      - name: Install CocoaPods
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          cd ios
          rm -f Podfile.lock
          pod install --repo-update

      - name: Build iOS Without Code Signing
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -o pipefail
          flutter build ios \
            --release \
            --no-codesign \
            --verbose 2>&1 | tee ios-build.log

      - name: Package Unsigned App
        if: success()
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          ARTIFACT_DIR="build/ios/artifacts"

          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found"
            exit 1
          fi

          mkdir -p "$ARTIFACT_DIR"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$ARTIFACT_DIR/Runner-unsigned.zip"

      - name: Upload Unsigned iOS App
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app
          path: ${{ steps.project.outputs.project_dir }}/build/ios/artifacts/Runner-unsigned.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ steps.project.outputs.project_dir }}/ios-build.log
          if-no-files-found: warn
          retention-days: 7
