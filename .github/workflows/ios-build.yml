name: Build Flutter iOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Build iOS Application
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml file missing!"
            exit 1
          fi
          
          TARGET_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Target Directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          echo "==> Running Flutter Pub Get"
          flutter pub get
          
          if [ -d "ios" ]; then
            echo "==> Installing CocoaPods"
            cd ios
            pod install || true
            cd ..
          fi
          
          echo "==> Building Flutter iOS Release"
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          TARGET_DIR=$(dirname "$PUBSPEC_PATH")
          cd "$TARGET_DIR"
          
          IPA_PATH=$(find . -type d -name "iphoneos" | head -n 1)
          if [ -n "$IPA_PATH" ]; then
            cd "$IPA_PATH"
            mkdir -p Payload
            cp -R Runner.app Payload/ 2>/dev/null || mv Runner.app Payload/
            zip -r ios-app.ipa Payload
          else
            echo "Error: iphoneos build directory missing"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-runner
          path: "**/ios-app.ipa"
