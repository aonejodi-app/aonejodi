
name: Build Flutter iOS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable

      - name: Locate Flutter Project
        id: project
        shell: bash
        run: |
          PUBSPEC_PATH=$(find . -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml not found"
            exit 1
          fi
          TARGET_DIR=$(dirname "$PUBSPEC_PATH")
          echo "project_dir=$TARGET_DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter project: $TARGET_DIR"

      - name: Get Flutter Dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          if [ ! -d ios ]; then
            echo "Error: ios folder not found"
            exit 1
          fi

          cd ios
          pod repo update

          # Keep the Podfile.lock unless dependency resolution requires a change.
          pod install --repo-update

      - name: Build iOS Release
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Error: Runner.app not found at $APP_PATH"
            find build/ios -maxdepth 4 -type d -name "*.app" || true
            exit 1
          fi

          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ios-app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-runner
          path: ${{ steps.project.outputs.project_dir }}/build/ios/ipa/ios-app.ipa
          if-no-files-found: error
